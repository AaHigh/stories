    "purpose": "Content parameters for the High Tower District Stories index. Edit this file for content changes. The index.html holds styles and presentation logic only.",
    "lastExtracted": "2026-08-30",
    "storyCount": 81,
    "note": "Index restyle 2026-08-30. Same JSON contract. Added date fields plus chronological view. Published repo stories that were missing from the old index were appended to their sections."
  }

  </script>

  <script>
    (function () {
      const contentEl = document.getElementById('content');
      const headerEl = document.getElementById('site-header');
      const footerEl = document.getElementById('site-footer');
      const btnCat = document.getElementById('btn-cat');
      const btnChrono = document.getElementById('btn-chrono');
      const countPill = document.getElementById('count-pill');
      const raw = document.getElementById('stories-data').textContent;
      const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

      function esc(s) {
        if (s == null) return '';
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }
      function escAttr(s) { return esc(s).replace(/'/g, '&#39;'); }

      function prettyDate(iso) {
        if (!iso) return '';
        const p = iso.split('-');
        if (p.length !== 3) return iso;
        const m = MONTHS[parseInt(p[1], 10) - 1];
        return m ? (m.slice(0, 3) + ' ' + parseInt(p[2], 10) + ', ' + p[0]) : iso;
      }

      function monthKey(iso) {
        if (!iso) return 'undated';
        return iso.slice(0, 7);
      }

      function monthTitle(key) {
        if (key === 'undated') return { yr: 'ARCHIVE', name: 'Undated' };
        const y = key.slice(0, 4);
        const m = MONTHS[parseInt(key.slice(5, 7), 10) - 1] || key;
        return { yr: y, name: m };
      }

      function flatten(data) {
        const out = [];
        for (const section of (data.sections || [])) {
          for (const story of (section.stories || [])) {
            out.push(Object.assign({ section: section.title }, story));
          }
        }
        return out;
      }

      function cardHTML(story, showDate) {
        const date = showDate ? prettyDate(story.date) : '';
        return (
          '<a href="' + escAttr(story.href) + '" class="story-card">' +
            '<div class="card-meta">' +
              '<div class="cat-label">' + esc(story.category) + '</div>' +
              (date ? '<div class="date-label">' + esc(date) + '</div>' : '') +
            '</div>' +
            '<h3>' + esc(story.title) + '</h3>' +
            '<p>' + esc(story.description) + '</p>' +
            '<span class="arrow">' + esc(story.arrow || 'read →') + '</span>' +
          '</a>'
        );
      }

      function renderCategories(data) {
        let html = '';
        for (const section of (data.sections || [])) {
          const n = (section.stories || []).length;
          html += '<section>' +
            '<div class="section-head"><h2>' + esc(section.title) + '</h2><div class="n">' + n + '</div></div>' +
            '<div class="grid">';
          for (const story of (section.stories || [])) html += cardHTML(story, true);
          html += '</div></section>';
        }
        return html || '<div class="status">No stories found.</div>';
      }

      function renderChrono(data) {
        const all = flatten(data);
        const dated = all.filter(function (s) { return s.date; });
        const undated = all.filter(function (s) { return !s.date; });
        dated.sort(function (a, b) {
          if (a.date === b.date) return a.title.localeCompare(b.title);
          return a.date < b.date ? 1 : -1;
        });
        const groups = {};
        const order = [];
        dated.forEach(function (s) {
          const k = monthKey(s.date);
          if (!groups[k]) { groups[k] = []; order.push(k); }
          groups[k].push(s);
        });
        let html = '<div class="jump">';
        order.forEach(function (k) {
          const t = monthTitle(k);
          html += '<a href="#m-' + k + '">' + esc(t.name.slice(0, 3) + ' ' + t.yr) + '</a>';
        });
        if (undated.length) html += '<a href="#m-undated">Undated</a>';
        html += '</div>';
        order.forEach(function (k) {
          const t = monthTitle(k);
          html += '<section id="m-' + k + '">' +
            '<div class="month-head"><div class="yr">' + esc(t.yr) + '</div><h2>' + esc(t.name) + '</h2></div>' +
            '<div class="grid">';
          groups[k].forEach(function (s) { html += cardHTML(s, true); });
          html += '</div></section>';
        });
        if (undated.length) {
          html += '<section id="m-undated">' +
            '<div class="month-head"><div class="yr">ARCHIVE</div><h2>Undated</h2></div>' +
            '<div class="grid">';
          undated.forEach(function (s) { html += cardHTML(s, false); });
          html += '</div></section>';
        }
        return html;
      }

      function currentView() {
        const hash = (location.hash || '').replace('#', '');
        if (hash === 'chrono' || hash.indexOf('m-') === 0) return 'chrono';
        if (hash === 'categories' || hash === 'cat') return 'categories';
        try {
          const saved = localStorage.getItem('ht-stories-view');
          if (saved === 'chrono' || saved === 'categories') return saved;
        } catch (e) {}
        return 'categories';
      }

      let DATA = null;

      function paint(view) {
        if (!DATA) return;
        const isChrono = view === 'chrono';
        btnCat.setAttribute('aria-pressed', isChrono ? 'false' : 'true');
        btnChrono.setAttribute('aria-pressed', isChrono ? 'true' : 'false');
        contentEl.innerHTML = isChrono ? renderChrono(DATA) : renderCategories(DATA);
        try { localStorage.setItem('ht-stories-view', view); } catch (e) {}
        if (isChrono && location.hash && location.hash.indexOf('#m-') === 0) {
          const el = document.getElementById(location.hash.slice(1));
          if (el) el.scrollIntoView({ block: 'start' });
        }
      }

      function setView(view, pushHash) {
        if (pushHash) {
          const next = view === 'chrono' ? '#chrono' : '#categories';
          if (location.hash !== next) history.replaceState(null, '', next);
        }
        paint(view);
      }

      try {
        DATA = JSON.parse(raw);
        if (DATA.site && DATA.site.pageTitle) document.title = DATA.site.pageTitle;
        if (DATA.header) {
          headerEl.innerHTML =
            '<div class="kicker">HIGH TOWER <span>DISTRICT</span></div>' +
            '<h1>' + esc(DATA.header.title) + '</h1>' +
            '<div class="sub">' + esc(DATA.header.subtitle) + '</div>' +
            '<p class="tagline">' + esc(DATA.header.tagline) + '</p>';
        }
        const total = flatten(DATA).length;
        countPill.textContent = total + ' stories';

        if (DATA.footer) {
          const links = (DATA.footer.links || [])
            .map(function (l) { return '<a href="' + escAttr(l.href) + '">' + esc(l.text) + '</a>'; })
            .join(' · ');
          footerEl.innerHTML =
            '<p>' + links + '</p>' +
            '<p class="credit">' + esc(DATA.footer.credit || '') + '</p>';
        }

        btnCat.addEventListener('click', function () { setView('categories', true); window.scrollTo(0, 0); });
        btnChrono.addEventListener('click', function () { setView('chrono', true); window.scrollTo(0, 0); });
        window.addEventListener('hashchange', function () { paint(currentView()); });

        setView(currentView(), false);
      } catch (err) {
        contentEl.innerHTML = '<div class="status">Data error</div>';
        console.error(err);
      }
    })();
  </script>
