    :root {
      --bg: #080018;
      --surface: #0e0024;
      --border: #5500aa;
      --cyan: #00ffff;
      --orange: #ff8800;
      --purple: #aa88ff;
      --green: #00ff88;
      --dim: #442266;
      --text: #e8e0ff;
      --muted: #9b8bb8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100dvh;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(85, 0, 170, 0.25), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(0, 255, 170, 0.06), transparent);
    }

    .led-border {
      border: 1px solid var(--border);
      box-shadow:
        0 0 0 1px rgba(85, 0, 170, 0.4),
        0 0 12px rgba(85, 0, 170, 0.25),
        inset 0 0 20px rgba(85, 0, 170, 0.08);
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .led-border:hover {
      border-color: var(--cyan);
      box-shadow:
        0 0 0 1px rgba(0, 255, 255, 0.5),
        0 0 18px rgba(0, 255, 255, 0.3),
        0 0 40px rgba(0, 255, 255, 0.12),
        inset 0 0 24px rgba(0, 255, 255, 0.06);
    }

    .cycle-title {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: linear-gradient(
        90deg,
        #00ffff,
        #aa88ff,
        #ff8800,
        #00ff88,
        #00ffff,
        #aa88ff
      );
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: hueCycle 8s linear infinite;
    }
    @keyframes hueCycle {
      0%   { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    .cat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cyan);
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.45);
    }

    .section-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--purple);
      margin-bottom: 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid rgba(85, 0, 170, 0.5);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .section-title::before {
      content: "";
      width: 6px;
      height: 6px;
      background: var(--orange);
      border-radius: 1px;
      box-shadow: 0 0 8px var(--orange);
      animation: ledPulse 2.4s ease-in-out infinite;
    }
    @keyframes ledPulse {
      0%, 100% { opacity: 0.5; box-shadow: 0 0 4px var(--orange); }
      50%      { opacity: 1;   box-shadow: 0 0 12px var(--orange), 0 0 20px rgba(255, 136, 0, 0.4); }
    }

    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 1px solid var(--cyan); outline-offset: 3px; }

    .story-card {
      background: var(--surface);
      border-radius: 10px;
      padding: 1.1rem 1.2rem;
      display: block;
      transition: transform 0.2s ease;
    }
    .story-card:hover {
      transform: translateY(-2px);
    }
    .story-card h3 {
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      margin: 0.25rem 0 0.45rem;
      line-height: 1.3;
    }
    .story-card p {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.45;
    }
    .story-card .arrow {
      display: inline-block;
      margin-top: 0.55rem;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--cyan);
      opacity: 0.7;
      transition: opacity 0.2s, transform 0.2s;
    }
    .story-card:hover .arrow {
      opacity: 1;
      transform: translateX(3px);
    }

    .wrap {
      max-width: 42rem;
      margin: 0 auto;
      padding: 0 1rem 4rem;
    }

    header {
      padding: 2.5rem 1rem 1.8rem;
      text-align: center;
      position: relative;
    }
    header::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(320px, 80%);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
    }

    .sub {
      margin-top: 0.6rem;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .tagline {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--muted);
      max-width: 28rem;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.5;
    }

    section {
      margin-top: 2.2rem;
    }

    .grid {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

      margin-top: 3.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(85, 0, 170, 0.35);
      text-align: center;
      font-size: 0.7rem;
      color: var(--dim);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.06em;
    }
    footer a {
      color: var(--purple);
    }
    footer a:hover {
      color: var(--cyan);
    }

    .status {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
    }

    @media (max-width: 420px) {
      .cycle-title { font-size: 1.35rem; }
      .story-card h3 { font-size: 0.98rem; }
    }
  </style>

  <script>
    (function () {
      const contentEl = document.getElementById('content');
      const headerEl = document.getElementById('site-header');
      const footerEl = document.getElementById('site-footer');
      const raw = document.getElementById('stories-data').textContent;

      try {
        const data = JSON.parse(raw);

        if (data.site && data.site.pageTitle) document.title = data.site.pageTitle;

        if (data.header) {
          headerEl.innerHTML =
            '<h1 class="cycle-title" style="font-size: clamp(1.4rem, 5vw, 1.85rem);">' +
            esc(data.header.title) + '</h1>' +
            '<div class="sub">' + esc(data.header.subtitle) + '</div>' +
            '<p class="tagline">' + esc(data.header.tagline) + '</p>';
        }

        let html = '';
        for (const section of (data.sections || [])) {
          html += '<section><div class="section-title">' + esc(section.title) + '</div><div class="grid">';
          for (const story of (section.stories || [])) {
            html +=
              '<a href="' + escAttr(story.href) + '" class="story-card led-border">' +
              '<div class="cat-label">' + esc(story.category) + '</div>' +
              '<h3>' + esc(story.title) + '</h3>' +
              '<p>' + esc(story.description) + '</p>' +
              '<span class="arrow">' + esc(story.arrow || 'read →') + '</span></a>';
          }
          html += '</div></section>';
        }
        contentEl.innerHTML = html || '<div class="status">No stories found.</div>';

        if (data.footer) {
          const links = (data.footer.links || [])
            .map(function (l) { return '<a href="' + escAttr(l.href) + '">' + esc(l.text) + '</a>'; })
            .join(' · ');
          footerEl.innerHTML =
            '<p>' + links + '</p>' +
            '<p style="margin-top:0.5rem; opacity:0.7;">' + esc(data.footer.credit || '') + '</p>';
        }
      } catch (err) {
        contentEl.innerHTML = '<div class="status">Data error</div>';
        console.error(err);
      }

      function esc(s) {
        if (s == null) return '';
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }
      function escAttr(s) {
        return esc(s).replace(/'/g, '&#39;');
      }
    })();
  </script>
